  // --- 신입 진행률 (직원 1명 → 필수 매뉴얼 N개 중 M개) ---
  function renderAdminProgress(body){
    var required = requiredManuals();
    var chips = ['<button class="chip' + (!state.progressBranchId ? ' active' : '') + '" data-branch="">전체</button>'];
    state.branches.forEach(function(b){
      chips.push('<button class="chip' + (state.progressBranchId === b.id ? ' active' : '') + '" data-branch="' + esc(b.id) + '">' + esc(b.name) + '</button>');
    });

    body.innerHTML =
      '<div class="section-head"><h3>신입 진행률</h3><span class="badge req">필수 ' + required.length + '개</span></div>' +
      '<div class="hint" style="margin-bottom:12px;">직원마다 "신입 필수" 매뉴얼을 몇 개 확인했는지 보여줘요. 등록 7일이 지났는데 남은 게 있으면 빨갛게 표시돼요.</div>' +
      '<div class="chips">' + chips.join('') + '</div>' +
      '<div id="progressResult"><div class="loading">불러오는 중…</div></div>';

    body.querySelectorAll('[data-branch]').forEach(function(el){
      el.addEventListener('click', function(){
        state.progressBranchId = el.getAttribute('data-branch') || null;
        render();
      });
    });

    var result = document.getElementById('progressResult');
    if (!required.length){
      result.innerHTML = '<div class="empty">아직 "신입 필수"로 지정된 매뉴얼이 없어요.<br>매뉴얼 관리 → 수정에서 "신입 필수 매뉴얼"을 체크해주세요.</div>';
      return;
    }
    var staffList = state.staff.filter(function(s){ return s.active !== false && (!state.progressBranchId || s.branch_id === state.progressBranchId); });
    if (!staffList.length){
      result.innerHTML = '<div class="empty">이 매장에 등록된 직원이 없어요.</div>';
      return;
    }

    var requiredIds = required.map(function(m){ return m.id; });
    sb.from('manual_confirmations').select('manual_id, staff_id, staff_name, confirmed_at').in('manual_id', requiredIds).then(function(res){
      if (res.error){ result.innerHTML = '<div class="empty">불러오기 실패</div>'; return; }
      var rows = res.data || [];
      // staff_id → { manual_id: confirmed_at }. 옛 기록은 이름으로 매칭
      var doneById = {}, doneByName = {};
      rows.forEach(function(c){
        var bucket = c.staff_id ? (doneById[c.staff_id] = doneById[c.staff_id] || {}) : (c.staff_name ? (doneByName[c.staff_name] = doneByName[c.staff_name] || {}) : null);
        if (bucket && !bucket[c.manual_id]) bucket[c.manual_id] = c.confirmed_at;
      });

      var cards = staffList.map(function(s){
        var done = Object.assign({}, doneByName[s.name] || {}, doneById[s.id] || {});
        var remaining = required.filter(function(m){ return !done[m.id]; });
        var doneCount = required.length - remaining.length;
        var last = null;
        Object.keys(done).forEach(function(k){ if (!last || done[k] > last) last = done[k]; });
        var days = daysSince(hireDate(s));
        return { staff: s, remaining: remaining, doneCount: doneCount, last: last, days: days, late: remaining.length > 0 && days > 7 };
      });
      cards.sort(function(a, b){
        if (a.late !== b.late) return a.late ? -1 : 1;
        if (a.remaining.length !== b.remaining.length) return b.remaining.length - a.remaining.length;
        return a.staff.name.localeCompare(b.staff.name);
      });

      var doneAll = cards.filter(function(c){ return !c.remaining.length; }).length;
      var lateCount = cards.filter(function(c){ return c.late; }).length;
      var summary = '직원 ' + cards.length + '명 중 완료 ' + doneAll + '명' + (lateCount ? ' · <span class="badge late">첫 주 지났는데 미완료 ' + lateCount + '명</span>' : '');

      result.innerHTML = '<div class="progress-summary">' + summary + '</div>' + cards.map(function(c){
        var pct = required.length ? Math.round(c.doneCount / required.length * 100) : 0;
        var isDone = !c.remaining.length;
        return (
          '<div class="progress-card">' +
            '<div class="top">' +
              '<div><div class="name">' + esc(c.staff.name) + (c.late ? ' <span class="badge late">첫 주 지남</span>' : '') + '</div>' +
                '<div class="meta">' + esc(branchName(c.staff.branch_id)) + ' · 등록 ' + c.days + '일째' + (c.last ? ' · 마지막 확인 ' + esc(fmtDate(c.last).slice(0, 10)) : '') + '</div></div>' +
              '<div class="count' + (isDone ? ' done' : '') + '">' + c.doneCount + ' / ' + required.length + '</div>' +
            '</div>' +
            '<div class="progress-bar"><i class="' + (isDone ? 'done' : '') + '" style="width:' + pct + '%"></i></div>' +
            (isDone
              ? '<div class="remain" style="color:var(--ok);">필수 매뉴얼을 모두 확인했어요.</div>'
              : '<div class="remain">남은 것: ' + c.remaining.map(function(m){ return '<span>' + esc(m.title) + '</span>'; }).join('') + '</div>') +
          '</div>'
        );
      }).join('');
    });
  }

  // --- 확인 현황 ---
  function renderAdminStatus(body){
    var options = state.manuals.map(function(m){
      return '<option value="' + esc(m.id) + '"' + (state.statusManualId === m.id ? ' selected' : '') + '>' + esc(m.title) + '</option>';
    }).join('');

    var chips = ['<button class="chip' + (!state.statusBranchId ? ' active' : '') + '" data-branch="">전체</button>'];
    state.branches.forEach(function(b){
      chips.push('<button class="chip' + (state.statusBranchId === b.id ? ' active' : '') + '" data-branch="' + esc(b.id) + '">' + esc(b.name) + '</button>');
    });

    body.innerHTML =
      '<div class="section-head"><h3>매뉴얼별 확인 현황</h3></div>' +
      '<div class="field"><select id="statusSelect"><option value="">매뉴얼을 선택하세요</option>' + options + '</select></div>' +
      '<div class="chips">' + chips.join('') + '</div>' +
      '<div id="statusResult"></div>';

    var sel = document.getElementById('statusSelect');
    sel.addEventListener('change', function(){
      state.statusManualId = sel.value || null;
      loadStatus();
    });
    body.querySelectorAll('[data-branch]').forEach(function(el){
      el.addEventListener('click', function(){
        state.statusBranchId = el.getAttribute('data-branch') || null;
        render();
      });
    });
    if (state.statusManualId) loadStatus();

    function loadStatus(){
      var result = document.getElementById('statusResult');
      if (!state.statusManualId){ result.innerHTML = ''; return; }
      result.innerHTML = '<div class="loading">불러오는 중…</div>';
      sb.from('manual_confirmations').select('*').eq('manual_id', state.statusManualId).order('confirmed_at', {ascending:false}).then(function(res){
        if (res.error){ result.innerHTML = '<div class="empty">불러오기 실패</div>'; return; }
        var confirmed = res.data || [];
        // 직원 ID로 연결된 기록이 기본, 옛 기록(staff_id 없음)은 이름으로 맞춰 봄
        var byStaffId = {}, byName = {};
        confirmed.forEach(function(c){
          if (c.staff_id){ if (!byStaffId[c.staff_id]) byStaffId[c.staff_id] = c.confirmed_at; }
          else if (c.staff_name){ if (!byName[c.staff_name]) byName[c.staff_name] = c.confirmed_at; }
        });
        var staffNames = {};
        state.staff.forEach(function(s){ staffNames[s.name] = true; });

        var staffList = state.staff.filter(function(s){ return !state.statusBranchId || s.branch_id === state.statusBranchId; });
        var combined = staffList.map(function(s){
          var date = byStaffId[s.id] || byName[s.name] || null;
          return { name: s.name, branch: branchName(s.branch_id), ok: !!date, date: date };
        });
        // 명단에 없는 이름으로 남은 옛 기록도 보여 줌 (전체 보기일 때만)
        if (!state.statusBranchId){
          Object.keys(byName).forEach(function(name){
            if (!staffNames[name]) combined.push({ name: name, branch: '옛 기록', ok: true, date: byName[name] });
          });
        }
        combined.sort(function(a,b){
          if (a.branch !== b.branch) return a.branch.localeCompare(b.branch);
          return a.name.localeCompare(b.name);
        });

        var rowsHtml = combined.map(function(row){
          return '<tr><td>' + esc(row.branch) + '</td><td>' + esc(row.name) + '</td><td>' +
            (row.ok ? '<span class="badge ok">확인함</span>' : '<span class="badge no">안 봄</span>') +
            '</td><td>' + (row.date ? esc(fmtDate(row.date)) : '-') + '</td></tr>';
        }).join('');

        result.innerHTML = combined.length ? (
          '<table class="confirm-status-table"><thead><tr><th>매장</th><th>이름</th><th>상태</th><th>확인 일시</th></tr></thead><tbody>' + rowsHtml + '</tbody></table>'
        ) : '<div class="empty">' + (state.statusBranchId ? '이 매장에 등록된 직원이 없어요.' : '직원 명단을 먼저 등록해주세요.') + '</div>';
      });
    }
  }

  loadAll();

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
