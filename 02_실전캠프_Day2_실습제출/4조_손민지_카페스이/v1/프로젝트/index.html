<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>브랜드에서 오픈까지 — 카페 창업 준비</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic:wght@400;700&display=swap">
<style>
:root{--coral:#C67F68;--corald:#A85A45;--corall:#EBD2C6;--cream:#F8F0E7;--panel:#FDF8F1;--card:#FFF;--ink:#4A403B;--grey:#8E7F74;--line:#E6D6C4;--sage:#7F9163;--sagel:#E4EAD9;--sagem:#EFF3E8;--mustard:#C9A24A;--warn:#B8862B;--warnl:#F6ECD3;
 --head:"Do Hyeon",sans-serif;--body:"Nanum Gothic","Apple SD Gothic Neo",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#26201D;--panel:#2F2824;--card:#362E29;--ink:#EFE5DA;--grey:#B3A395;--line:#4D423B;--corall:#6E4E42;--sagel:#3C4632;--sagem:#333A2C;--warnl:#4A3D22}}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;word-break:keep-all}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3{font-family:var(--head);font-weight:400;letter-spacing:-.01em;margin:0;text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:25px;color:var(--corald)}
.sub{font-size:13px;color:var(--grey);margin-top:2px}
.saved{font-size:12px;color:var(--grey);display:flex;align-items:center;gap:6px;white-space:nowrap}
.saved i{width:8px;height:8px;border-radius:50%;background:var(--sage);display:inline-block}
.tools{display:flex;gap:6px}
.tools button{border:1px solid var(--line);background:var(--panel);color:var(--grey);border-radius:8px;padding:5px 10px;font:700 12px var(--body);cursor:pointer}
.tools button:hover{color:var(--corald);border-color:var(--coral)}
.journey{margin-bottom:16px}
.jlabels{display:flex;justify-content:space-between;font-size:11px;color:var(--grey);margin-bottom:5px}
.jbar{display:flex;gap:3px;height:12px}
.jseg{flex:1;background:var(--line);border-radius:3px;overflow:hidden}
.jseg i{display:block;height:100%;background:var(--coral);transition:width .3s}
.jseg.open i{background:var(--sage)}
.cols{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;position:sticky;top:14px}
@media (max-width:820px){.side{position:static;order:2}}
.side h2{font-size:17px;color:var(--sage);display:flex;justify-content:space-between;align-items:baseline}
.side h2 b{font:700 12px var(--body);color:var(--grey);font-variant-numeric:tabular-nums}
.side .cap{font-size:12px;color:var(--grey);margin:4px 0 10px;line-height:1.5}
.grp{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.grp:first-of-type{border-top:0;margin-top:0;padding-top:0}
.ghead{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:0;padding:5px 0;cursor:pointer;font:700 13.5px var(--body);color:var(--sage);text-align:left}
.ghead .c{font:700 11px var(--body);color:var(--grey);font-variant-numeric:tabular-nums}
.ghead:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.ck{display:grid;grid-template-columns:19px 1fr;gap:7px;padding:6px 0;align-items:start;font-size:13px}
.ck .mk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:11px;color:transparent;cursor:pointer;margin-top:1px}
.ck .mk.on{background:var(--sage);border-color:var(--sage);color:#fff}
.ck .mk:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.ck.done .lb{color:var(--sage)}
.ck .sm{font-size:11px;color:var(--grey);display:block}
.ck .done-at{font-size:10.5px;color:var(--sage);display:block;margin-top:2px}
.ck input.memo,.ck input.cost{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:7px;padding:4px 7px;font:12px var(--body);background:var(--card);color:var(--ink)}
.ck input.cost{text-align:right;font-variant-numeric:tabular-nums}
.ck .carry{margin-top:4px;font-size:11.5px;color:var(--sage);background:var(--sagel);border-radius:6px;padding:4px 7px}
.sumbox{margin-top:10px;border-top:2px solid var(--sage);padding-top:9px;display:flex;justify-content:space-between;align-items:baseline}
.sumbox b{font:17px var(--head);color:var(--sage);font-variant-numeric:tabular-nums}
.warnbox{font-size:11.5px;color:var(--warn);background:var(--warnl);border-radius:7px;padding:5px 8px;margin-top:7px;line-height:1.45}
.main{min-width:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tab{border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;background:var(--panel);text-align:center;font-family:var(--head);color:var(--grey);font-size:15px;line-height:1.25;cursor:pointer}
.tab span{display:block;font-family:var(--body);font-size:11px;margin-top:3px;color:var(--grey)}
.tab .cnt{display:block;font-family:var(--body);font-size:11px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.tab.on{background:var(--coral);border-color:var(--coral);color:#fff}
.tab.on span,.tab.on .cnt{color:#FBF3E6}
.tab.d2.on{background:var(--sage);border-color:var(--sage)}
.tab.d3.on{background:var(--mustard);border-color:var(--mustard)}
.tab:focus-visible{outline:2px solid var(--corald);outline-offset:2px}
.dayhead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.dayhead h3{font-size:21px;color:var(--corald)}
.dayhead p{margin:4px 0 0;font-size:13px;color:var(--grey)}
.dayprog{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:12px;color:var(--grey)}
.dayprog .track{flex:1;height:8px;border-radius:99px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.dayprog .fill{height:100%;background:var(--coral);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:grid;gap:10px}
.item{display:grid;grid-template-columns:24px 1fr;gap:9px}
.item.done{background:var(--sagem);margin:-6px -8px;padding:6px 8px;border-radius:10px}
.mark{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:13px;color:transparent;margin-top:1px}
.mark.on{background:var(--sage);border-color:var(--sage);color:#fff}
.mark.auto{border-style:dashed}
.mark.hand{cursor:pointer}
.mark.hand:focus-visible{outline:2px solid var(--corald);outline-offset:2px}
.t{font-weight:700;font-size:15px}
.item.done .t{color:var(--sage)}
.no{font-size:11px;color:var(--grey);font-weight:400;margin-right:5px;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--grey);font-weight:400;margin-top:2px}
.carry{margin-top:7px;font-size:12.5px;color:var(--sage);background:var(--sagel);border-radius:8px;padding:6px 9px}
.fbox{margin-top:9px}
.fbox label{display:block;font:700 12.5px var(--body);color:var(--corald);margin-bottom:3px}
.fhelp{font-size:11.5px;color:var(--grey);margin-bottom:4px;line-height:1.45}
.fbox textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:13px var(--body);background:var(--panel);color:var(--ink);resize:vertical}
.fbox textarea:focus{outline:2px solid var(--coral);outline-offset:-1px}
.seam{margin-top:12px;padding:11px 13px;background:var(--sagel);border-radius:11px;font-size:13px;color:var(--sage);line-height:1.55}
@media (prefers-reduced-motion:reduce){.jseg i,.dayprog .fill{transition:none}}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div><h1>브랜드에서 오픈까지</h1><div class="sub">카페 창업 준비 — 브랜드를 정하는 3일부터 오픈까지</div></div>
    <div style="display:grid;gap:6px;justify-items:end">
      <div class="saved" id="saved"><i></i><span>저장됨</span></div>
      <div class="tools"><button id="btnFill">예시 채우기</button><button id="btnClear">비우고 시작</button></div>
    </div>
  </div>
  <div class="journey">
    <div class="jlabels"><span style="color:var(--corald)"><b>브랜드 정하기</b> DAY 1·2·3</span><span style="color:var(--sage)"><b>창업 준비</b> 4단계</span></div>
    <div class="jbar" id="jbar"></div>
  </div>
  <div class="cols">
    <aside class="side" id="side"></aside>
    <div class="main"><div class="tabs" id="tabs"></div><div id="day"></div></div>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body></html>
